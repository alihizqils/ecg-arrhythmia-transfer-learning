version: s4_full_v3
scenario: S4
source_scenario: S3
source_output: outputs_v2
output: outputs_s4_full_v3
tau: 2.0
encoder_training: full_backbone
batchnorm_running_statistics: frozen
batchnorm_affine_parameters: trainable
head_training: trainable
optimizer: AdamW
weight_decay: 0.0001
encoder_learning_rate: 0.00001
head_learning_rate: 0.0001
warmup_epochs: 3
warmup_start_factor: 0.1
scheduler: linear_warmup_then_cosine
scheduler_horizon_epochs: 60
maximum_epochs: 60
early_stopping_patience: 10
primary_metric: macro_f1
epoch_zero_role: audit_baseline_only
epoch_zero_eligible_for_checkpoint: false
epoch_zero_eligible_for_final_selection: false
final_epoch_rule: argmax_mean_validation_macro_f1_common_positive_epochs
initialization_anchor_windows: 64
initialization_probability_tolerance: 0.01
required_device_substring: RTX 4050
holdout_used_for_selection: false
