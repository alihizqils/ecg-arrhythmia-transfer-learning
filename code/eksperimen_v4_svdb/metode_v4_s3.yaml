# Aturan S3 V4: full fine-tuning dari checkpoint S2 fold/final yang sama.
# Berkas terpisah dari metode_v4.yaml agar hash metode S1/S2 tidak berubah.
# Kontrak mengikuti S4 full fine-tuning eksperimen eksplorasi (s4_full_v3.yaml):
# seluruh parameter encoder trainable (termasuk affine BatchNorm), running
# statistics BatchNorm beku, AdamW, LR encoder 1e-5 dan head 1e-4, weight decay 1e-4.
# Seluruh aturan V4 lain (label valid, fitur, head, EMA Revisi 12, tau 2, sampler,
# cosine horizon 60 epoch) diwarisi dari v4_pipeline tanpa perubahan.
# Perbedaan dari eksplorasi: tanpa warm-up 3 epoch (scheduler V4 dipakai apa adanya;
# EMA bobot meredam lonjakan awal).
version: metode_v4_s3
scenario: S3
source_scenario: S2
tau: 2.0
encoder_learning_rate: 0.00001
head_learning_rate: 0.0001
weight_decay: 0.0001
min_epochs: 10
# Audit inisialisasi: model S3 epoch 0 (encoder ImageNet mentah + head S2) wajib
# mereproduksi probabilitas validasi checkpoint S2 (jalur embedding cache).
initialization_probability_tolerance: 0.01
holdout_used_for_selection: false
